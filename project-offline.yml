# Generated by Tools/GenerateOfflineProject.py. No Firebase; reporting unavailable.
name: SortScapeOffline
options:
  bundleIdPrefix: com.sortscape
  deploymentTarget:
    iOS: '17.0'
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.12.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
configFiles:
  Debug: Configuration/Ads.xcconfig
  Release: Configuration/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
targets:
  PuzzleCore:
    type: framework
    platform: iOS
    sources: [Sources/PuzzleCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SortScape:
    type: application
    platform: iOS
    info:
      path: Configuration/SortScape-Info.plist
      properties:
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FirebaseCrashlyticsCollectionEnabled: false
        FirebaseAutomaticScreenReportingEnabled: false
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_ANALYTICS_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_USER_DATA: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION: false
        SortScapeTelemetryEnvironment: $(TELEMETRY_ENVIRONMENT)
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        SortScapePrivacyPolicyURL: $(SORTSCAPE_PRIVACY_POLICY_URL)
        SortScapeStoreEnabled: false
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        GADDelayAppMeasurementInit: true
        SortScapeAdsEnabled: $(ADS_ENABLED)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    sources:
      - path: Sources/SortScape
        excludes: [Resources/SortScape.storekit, Resources/Firebase]
    dependencies:
      - target: PuzzleCore
      - sdk: StoreKit.framework
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    postBuildScripts:
      - name: Select Firebase environment
        script: |
          set -eu
          case "${TELEMETRY_ENVIRONMENT}" in Development|Production) ;; *) echo "error: Invalid telemetry environment"; exit 1 ;; esac
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ "$CONFIGURATION" = Release ]; then
            test "$TELEMETRY_ENVIRONMENT" = Production && test "$ADS_ENABLED" = NO || { echo "error: Unsafe Release configuration"; exit 1; }
            rm -f "${destination}/StoreProducts.json"
          fi
          rm -f "${destination}/GoogleService-Info-Development.plist" "${destination}/GoogleService-Info-Production.plist"
          source="${SRCROOT}/Sources/SortScape/Resources/Firebase/GoogleService-Info-${TELEMETRY_ENVIRONMENT}.plist"
          if [ -f "$source" ]; then cp "$source" "${destination}/GoogleService-Info-${TELEMETRY_ENVIRONMENT}.plist"; fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        PRODUCT_BUNDLE_IDENTIFIER: com.sortscape.puzzleworlds
        SORTSCAPE_PRIVACY_POLICY_URL: https://aperros.com/developer/apps/sortscape/privacy
        INFOPLIST_KEY_CFBundleDisplayName: SortScape
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: '1,2'
  PuzzleCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/PuzzleCoreTests]
    dependencies:
      - target: PuzzleCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SortScapeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SortScapeTests
      - path: Sources/SortScape/Resources/SortScape.storekit
        buildPhase: resources
    dependencies:
      - target: SortScape
      - target: PuzzleCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SortScapeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SortScapeUITests
      - path: Sources/SortScape/Resources/SortScape.storekit
        buildPhase: resources
    dependencies:
      - target: SortScape
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SortScape:
    run:
      storeKitConfiguration: Sources/SortScape/Resources/SortScape.storekit
    build:
      targets:
        SortScape: all
        PuzzleCoreTests: [test]
        SortScapeUITests: [test]
        SortScapeTests: [test]
    test:
      targets: [PuzzleCoreTests, SortScapeTests, SortScapeUITests]
      environmentVariables:
        SORTSCAPE_DISABLE_STORE_START: "1"
        SORTSCAPE_DISABLE_ADS: "1"

  SortScape Local Store:
    build:
      targets:
        SortScape: all
    run:
      config: Debug
      storeKitConfiguration: Sources/SortScape/Resources/SortScape.storekit
